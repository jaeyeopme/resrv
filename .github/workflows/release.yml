name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, with or without leading v"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/resrv-platform-api

    steps:
      - uses: actions/checkout@v6

      - name: Resolve release version
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            raw_version="$INPUT_VERSION"
          else
            raw_version="${GITHUB_REF_NAME}"
          fi

          version="${raw_version#v}"
          tag="v${version}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release version must look like 1.2.3 or 1.2.3-rc.1" >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify and build release jar
        run: >
          ./gradlew
          rewriteDryRun
          check
          :platform:bootJar
          -PreleaseVersion="${{ steps.release.outputs.version }}"
          --no-daemon

      - name: Publish container package
        run: >
          ./gradlew
          :platform:jib
          -PreleaseVersion="${{ steps.release.outputs.version }}"
          -Djib.to.image="${IMAGE_NAME}:${{ steps.release.outputs.version }}"
          -Djib.to.auth.username="${{ github.actor }}"
          -Djib.to.auth.password="${{ secrets.GITHUB_TOKEN }}"
          --no-daemon

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create
          "${{ steps.release.outputs.tag }}"
          "platform/build/libs/resrv-platform-api-${{ steps.release.outputs.version }}.jar"
          --generate-notes
          --title "${{ steps.release.outputs.tag }}"
