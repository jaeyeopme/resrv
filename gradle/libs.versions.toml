[versions]
spring-boot = "4.0.5"
dependency-management = "1.1.7"
spotless = "7.0.4"
google-java-format = "1.27.0"
bouncycastle = "1.80"
java-uuid-generator = "5.1.0"
archunit = "1.4.1"
springdoc-openapi = "3.0.3"
swagger-core = "2.2.47"

[libraries]
# Nullness annotations for API contracts (@Nullable, @NonNull)
jspecify = { module = "org.jspecify:jspecify" }
# UUID v7 generation (time-ordered, index-friendly)
java-uuid-generator = { module = "com.fasterxml.uuid:java-uuid-generator", version.ref = "java-uuid-generator" }

# Bouncy Castle for Argon2 password hashing
bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
# Transaction management (@Transactional)
spring-tx = { module = "org.springframework:spring-tx" }
# Spring context (@Service, @Component, etc.)
spring-context = { module = "org.springframework:spring-context" }

# Jackson 3 databind (JSON serialization in security adapters)
jackson-databind = { module = "tools.jackson.core:jackson-databind" }

# --- Spring Boot Starters (versions managed by BOM) ---

# Spring MVC for REST controllers
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
# Bean Validation for request DTO validation
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
# Spring Data JPA + Hibernate ORM
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
# Flyway database migration runner
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
# Authentication and authorization
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
# OAuth2 Resource Server + JWT decoder (nimbus-jose-jwt included)
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
# Base test infrastructure (JUnit, Mockito, AssertJ, Spring Test)
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
# Auto-start Docker Compose for local development
spring-boot-docker-compose = { module = "org.springframework.boot:spring-boot-docker-compose" }
# Generated OpenAPI description and Swagger UI for Spring MVC
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc-openapi" }
# Swagger/OpenAPI annotations used by adapter DTOs and controllers
swagger-annotations-jakarta = { module = "io.swagger.core.v3:swagger-annotations-jakarta", version.ref = "swagger-core" }

# --- Persistence ---

# Flyway PostgreSQL dialect support
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
# PostgreSQL JDBC driver
postgresql = { module = "org.postgresql:postgresql" }

# --- Testing ---

# ArchUnit for architecture rule verification
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
# JPA test slice (@DataJpaTest)
spring-boot-starter-data-jpa-test = { module = "org.springframework.boot:spring-boot-starter-data-jpa-test" }
# Flyway test utilities
spring-boot-starter-flyway-test = { module = "org.springframework.boot:spring-boot-starter-flyway-test" }
# WebMvc test slice (@WebMvcTest)
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
# Spring Security test utilities (SecurityMockMvcRequestPostProcessors.jwt, etc.)
spring-security-test = { module = "org.springframework.security:spring-security-test" }
# Testcontainers Spring Boot integration (@ServiceConnection)
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
# JUnit 5 lifecycle management for containers
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
# PostgreSQL container for integration tests
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
dependency-management = { id = "io.spring.dependency-management", version.ref = "dependency-management" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
